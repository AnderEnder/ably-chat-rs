[package]
name = "ably-chat-rs"
description = "Unofficial, ergonomic Rust client for the Ably Chat REST API (v4). Not affiliated with or endorsed by Ably."
readme = "README.md"
documentation = "https://docs.rs/ably-chat-rs"
keywords = ["ably", "chat", "rest", "client", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "ably_chat"

[dependencies]
ably-chat-openapi = { version = "0.2.0", path = "../ably-chat-openapi" }
ably-auth-openapi = { version = "0.2.0", path = "../ably-auth-openapi", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
base64 = "0.22"
bytes = "1"
urlencoding = "2"
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
jsonwebtoken = { version = "9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
default = ["rustls", "capabilities", "jwt"]
native-tls = ["reqwest/native-tls", "ably-chat-openapi/native-tls", "ably-auth-openapi?/native-tls"]
rustls = ["reqwest/rustls", "ably-chat-openapi/rustls", "ably-auth-openapi?/rustls"]
chrono = ["dep:chrono"]
# Permissions/issuance (ADR-0012, SPEC §13). On by default; disable via default-features = false.
capabilities = []
jwt = ["dep:jsonwebtoken"]
# Ergonomic server-side token issuance via the platform requestToken endpoint.
# Off by default: it links the ably-auth-openapi generated crate and holds
# your API secret. Enable explicitly: --features token-issuance.
token-issuance = ["dep:ably-auth-openapi"]

[package.metadata.docs.rs]
# Document the default (rustls) TLS backend + chrono + token-issuance; avoid
# dragging OpenSSL (native-tls) onto the docs.rs builder via all-features.
# Safe to include token-issuance here: rustls is a default feature and
# propagates to the optional ably-auth-openapi dep only weakly
# (`ably-auth-openapi?/rustls`), so this does not pull in native-tls/OpenSSL.
features = ["chrono", "token-issuance"]
